{% extends "base.html" %}
{% block body %}
<div class="wrap-narrow page">
  <div class="panel message">
    <h1 class="t-h1">Send alerts to {{ addr }}?</h1>
    <p class="text-muted">Seat and trade alerts from {{ SITE_NAME }} will go to this address.</p>
    <form method="post">
      <button class="btn btn-primary-ink btn-lg-cta">Confirm</button>
    </form>
  </div>
</div>
{% endblock %}
