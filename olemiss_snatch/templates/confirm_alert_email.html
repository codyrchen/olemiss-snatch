{% extends "base.html" %}
{% block body %}
<div class="container py-5" style="max-width: 560px">
  <div class="card snatch-card text-center">
    <div class="card-body p-5">
      <h2 class="h4 fw-bold mb-2">Send alerts to {{ addr }}?</h2>
      <p class="text-muted small mb-4">Seat and trade alerts from {{ SITE_NAME }} will go to this address.</p>
      <form method="post">
        <button class="btn btn-snatch btn-lg px-5">Confirm</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
