{% extends "base.html" %}
{% block body_class %}app{% endblock %}
{% block body %}
<div class="wrap page app-grid">
  <aside class="search-col">
    <form onsubmit="return false">
      <select class="form-select" id="term-select" aria-label="Term">
        {% for t in terms %}
          <option value="{{ t }}" {% if t == term %}selected{% endif %}>{{ term_name(t) }}</option>
        {% endfor %}
      </select>
      <input type="search" class="form-control" id="search-input" autocomplete="off"
             placeholder="Course code, title or instructor"
             aria-label="Search courses" autofocus>
    </form>
    <div id="search-results" class="search-results">
      <div class="search-hint">Try <em>MATH 1150</em>, <em>CSCI</em> or <em>Biology</em>.</div>
    </div>
  </aside>
  <main>
    {% block main %}{% endblock %}
  </main>
</div>
{% endblock %}
