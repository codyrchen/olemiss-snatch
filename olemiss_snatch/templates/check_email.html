{% extends "base.html" %}
{% block body %}
<div class="container py-5" style="max-width: 560px">
  <div class="card snatch-card text-center">
    <div class="card-body p-5">
      <div class="step-icon mx-auto mb-3"><i class="bi bi-envelope-check"></i></div>
      <h2 class="h4 fw-bold">Check your email</h2>
      <p class="text-muted mb-1">We sent a sign-in link to <strong>{{ email }}</strong>.</p>
      <p class="text-muted small">It expires in 15 minutes. Check Junk if you don't see it.</p>
      <a href="{{ url_for('index') }}" class="btn btn-link">Use a different email</a>
    </div>
  </div>
</div>
{% endblock %}
